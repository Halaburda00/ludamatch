[project]
name = "ludamatch"
license = "MIT"
version = "0.1.0"
description = "Matches video game entries across stores to one canonical record"
readme = "README.md"
authors = [
    { name = "Mateusz Halaburda", email = "mateusz.halaburda00@gmail.com" }
]
# 3.11 for `StrEnum`. A library others depend on, so a range rather than the
# single interpreter an application image can afford.
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src/ludamatch --cov-report=term-missing --cov-fail-under=100"
